name: Deploy to GitHub Pages

# deploy โฟลเดอร์ docs/ ขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push เข้า main
# ตั้งค่าครั้งเดียว: repo → Settings → Pages → Source = "GitHub Actions" (ดู DEPLOYMENT.md)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # เว็บที่ใช้งานจริงอยู่ใน docs/ (เหมือนตอน deploy จาก branch /docs เดิม)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
